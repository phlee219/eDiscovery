<style>:root{color-scheme:light;--ink:#142238;--muted:#536277;--line:#d7e0ec;--blue:#164fe0;--navy:#102440;--bg:#edf2f8;--red:#a32230;--green:#08614c;--amber:#8b4900;font-family:system-ui,-apple-system,'Segoe UI','Malgun Gothic','Apple SD Gothic Neo',sans-serif;font-size:16px}

.empty{border:2px dashed var(--line);border-radius:9px;padding:2rem 1rem;text-align:center;color:var(--muted);font-size:.9rem;line-height:1.7;white-space:pre-line;margin-top:.8rem}

.cardbody{padding:.2rem .9rem .9rem}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 .9rem}

.mapwrap{max-height:320px;overflow:auto;border:1px solid var(--line);border-radius:6px;margin-top:.4rem}
.rowtools{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.5rem}.rowtools button{font-size:.8rem;padding:.4rem .6rem}
.chips{display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.3rem}.chips label{margin:0;border:1px solid var(--line);border-radius:20px;padding:.25rem .6rem;display:flex;gap:.35rem;align-items:center;font-weight:500;font-size:.82rem}
.dateentry{border:1px solid var(--line);border-radius:7px;padding:.1rem .7rem .6rem;margin-top:.6rem}.dateentry .hdr{display:flex;justify-content:space-between;align-items:center;margin-top:.4rem}
.srclist .srcrow{display:flex;gap:.4rem;align-items:center;margin-top:.35rem}.srclist .srcrow select{flex:1}

<body>
<header>
<span class="creator-credit" aria-hidden="true">이현수 · HYUNSOO LEE</span>
<div class="brand"><h1>Delivery Work</h1><span class="version" id="version"></span><span class="local" data-i18n="localBadge"></span></div>
<div class="header-tools"><button id="saveSettings" type="button" data-i18n="saveSettings"></button><button id="loadSettingsButton" type="button" data-i18n="loadSettings"></button><input id="loadSettings" type="file" accept=".json" hidden>
<div class="lang" role="group" aria-label="Language"><button type="button" id="langEn" lang="en">EN</button><button type="button" id="langKo" lang="ko">한국어</button></div></div>
</header>
<main>
<div class="progressline" id="progressLine" hidden><progress id="progress" max="100" value="0"></progress><span id="progressText" role="status"></span><button id="cancel" type="button" class="danger" data-i18n="cancel"></button></div>
<div id="cleanupWarning" class="status error" role="alert" hidden></div>
<div class="workspace">
<fieldset id="inputs">
<section class="panel"><h2><span class="step">1</span><span data-i18n="s1"></span></h2>
<div class="source-controls">
<label class="drop" id="drop" tabindex="0" for="sourceFile"><strong data-i18n="dropTitle"></strong><span class="small muted" data-i18n="dropHint"></span><input id="sourceFile" type="file" accept=".dat,.txt,.load"></label>
<div id="sourceFacts" class="facts muted"></div>
<div>
<label for="idColumn" data-i18n="idColumn"></label><select id="idColumn" disabled></select>
<p class="small muted" data-i18n="idHint"></p>
</div></div>
<details id="sampleBox" hidden><summary data-i18n="firstRows"></summary><p class="small muted" data-i18n="previewHint"></p><div class="tablewrap" tabindex="0" role="region" aria-label="First records"><table class="list" id="sampleTable"></table></div></details>
</section>
</fieldset>
<fieldset id="taskInputs">
<section class="panel"><h2><span class="step">2</span>Delivery Work</h2>
<p class="small muted" style="margin:0" data-i18n="s2Hint"></p>
<div class="addbar" id="addbar"></div>
<div id="cards"></div>
<div class="empty" id="emptyCards" data-i18n="emptyCards"></div>
</section>
</fieldset>
<section class="panel runpanel"><h2><span class="step">3</span><span data-i18n="s3"></span></h2>
<div id="status" class="status" role="status" aria-live="polite"></div>
<button id="runCheck" type="button" class="primary full" disabled data-i18n="runCheck"></button>
<div id="results" hidden>
<div class="stats" id="stats"></div>
<div class="tablewrap"><table class="list" id="taskStats"></table></div>
<div id="issueBox" hidden><p class="small" id="issueText"></p><div class="tablewrap"><table class="list" id="issueTable"></table></div><button id="issueCsv" type="button" class="full" data-i18n="issueCsv"></button></div>
</div>
<label for="outputName" data-i18n="outputName"></label><input id="outputName" type="text" value="delivery.dat" autocomplete="off">
<label class="check"><input id="reviewedPlan" type="checkbox" disabled><span data-i18n="reviewPlan"></span></label>
<button id="save" type="button" class="primary full mt" disabled data-i18n="save"></button>
<p class="small muted" data-i18n="saveHint"></p>
<div id="manualVerification" hidden><label for="savedFile" data-i18n="manualLabel"></label><input id="savedFile" type="file" accept=".dat,.txt,.load"><button id="verifySaved" type="button" class="full mt" disabled data-i18n="verifySaved"></button></div>
<div id="verification" class="status"></div>
<button id="report" type="button" class="full" disabled data-i18n="report"></button>
</section>
</div>
<footer data-i18n="footer"></footer>
</main>

function workerBoot(){

  let plan=null,expected=null,busy=false,token=0;const acks=new Map();
  const post=(m,e)=>self.postMessage({type:'error',id:m.id,error:e.message||String(e),code:e.code,args:e.args});

    if(m.type==='ack'){const p=acks.get(m.token);if(p){acks.delete(m.token);if(m.error){const e=new Error(m.error);e.code=m.code;e.args=m.args;p.reject(e);}else p.resolve();}return;}
    if(busy){self.postMessage({type:'error',id:m.id,error:'busy',code:'busyWorker',args:[]});return;}
    busy=true;
    try{
      let result;
      if(m.op==='inspect'){plan=null;expected=null;result=await core.inspect(m.file);}
      else if(m.op==='profile')result=await core.profile(m.file,m.columns,m.delimiter,m.hash);
      else if(m.op==='preflight'){plan=null;expected=null;const r=await core.preflight(m.file,m.tasks,m.idName,m.headers,m.hash);plan=r.plan;result=r.report;}

      else if(m.op==='verify'){if(!plan||!expected){const e=new Error('noResult');e.code='noResult';e.args=[];throw e;}result=await core.verify(plan,m.file,expected);}
      else throw new Error('Unknown operation.');

    }catch(e){post(m,e);}finally{busy=false;}

    const todo=info?compiled.problems.filter(p=>p.length).length:0;status('stSettingsLoaded',[tasks.length,info?(todo?t('stSettingsSomeTodo',todo):t('stSettingsAllOk')):t('stSettingsNoDat')]);}
  catch(e){if(live(r))status('raw',[e],'error');}finally{await finishRun(r);}
};
$('langEn').onclick=()=>setLang('en');$('langKo').onclick=()=>setLang('ko');
addEventListener('beforeunload',e=>{if(busy){e.preventDefault();e.returnValue='';}});
const st=core.selfTest();selfTestOk=st.ok;applyStatic();
try{makeWorker();renderSource();renderAddbar();renderCards();clearVerification();status(st.ok?'stStart':'stSelfTest',[],st.ok?'':'error');}catch(e){status('stStartFailed',[e.message],'error');}
